<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="880" viewBox="0 0 1500 880" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#53657c"/>
    </marker>
    <marker id="seta-adv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c7784a"/>
    </marker>
    <style>
      .box { fill: #f4f7fa; stroke: #40566b; stroke-width: 1.5; }
      .exp { fill: #fdf1ef; stroke: #b03a2e; stroke-width: 2.5; }
      .ext { fill: #eef1f5; stroke: #8b9baa; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .ext-exp { fill: #fdf1ef; stroke: #b03a2e; stroke-width: 2.5; stroke-dasharray: 6 4; }
      .titulo { font-weight: bold; fill: #1f2d3d; font-size: 14px; }
      .desc { fill: #40566b; }
      .e { fill: #b03a2e; }
      .eb { fill: #b03a2e; font-weight: bold; }
      .div { stroke: #b03a2e; stroke-width: 1; }
      .fluxo { stroke: #53657c; stroke-width: 1.8; fill: none; marker-end: url(#seta); }
      .fluxo-tr { stroke: #53657c; stroke-width: 1.8; fill: none; stroke-dasharray: 6 4; marker-end: url(#seta); }
      .adv { stroke: #c7784a; stroke-width: 3; fill: none; marker-end: url(#seta-adv); }
      .adv-tr { stroke: #c7784a; stroke-width: 2.5; fill: none; stroke-dasharray: 8 5; marker-end: url(#seta-adv); }
      .rot { fill: #2d3e50; }
      .rot-adv { fill: #a65a30; font-weight: bold; }
    </style>
  </defs>

  <rect width="1500" height="880" fill="#ffffff"/>

  <!-- Atores -->
  <g>
    <circle cx="110" cy="168" r="14" fill="#fff0e8" stroke="#c7784a" stroke-width="2"/>
    <path d="M110,182 v34 M86,194 h48 M110,216 l-18,26 M110,216 l18,26" stroke="#c7784a" stroke-width="2" fill="none"/>
    <text x="110" y="262" text-anchor="middle" class="titulo" fill="#a65a30">Revendedor</text>
    <text x="110" y="279" text-anchor="middle" class="desc">(adversário)</text>
  </g>
  <g>
    <circle cx="110" cy="418" r="14" fill="#e7f4ee" stroke="#388064" stroke-width="2"/>
    <path d="M110,432 v34 M86,444 h48 M110,466 l-18,26 M110,466 l18,26" stroke="#388064" stroke-width="2" fill="none"/>
    <text x="110" y="512" text-anchor="middle" class="titulo">Comprador legítimo</text>
  </g>
  <g>
    <circle cx="900" cy="704" r="14" fill="#e7f4ee" stroke="#388064" stroke-width="2"/>
    <path d="M900,718 v34 M876,730 h48 M900,752 l-18,26 M900,752 l18,26" stroke="#388064" stroke-width="2" fill="none"/>
    <text x="900" y="798" text-anchor="middle" class="titulo">Administrador</text>
  </g>

  <!-- Fronteira do sistema -->
  <rect x="240" y="90" width="1220" height="570" rx="10" fill="#ffffff" stroke="#174775" stroke-width="2"/>
  <text x="960" y="644" class="titulo" fill="#174775">ScalperObliterator3000 (sistema em análise)</text>

  <!-- Fluxo de compra -->
  <g>
    <rect x="270" y="150" width="200" height="170" rx="6" class="exp"/>
    <text x="284" y="176" class="titulo">1. Cadastro de contas</text>
    <text x="284" y="198" class="desc">cria e acessa contas</text>
    <line x1="270" y1="262" x2="470" y2="262" class="div"/>
    <text x="284" y="284" class="e"><tspan class="eb">E1</tspan> conta nova quase</text>
    <text x="284" y="302" class="e">não custa nada (P1)</text>
  </g>
  <g>
    <rect x="500" y="150" width="200" height="170" rx="6" class="exp"/>
    <text x="514" y="176" class="titulo">2. Compra e checkout</text>
    <text x="514" y="198" class="desc">limite de 4 ingressos</text>
    <text x="514" y="215" class="desc">por conta</text>
    <line x1="500" y1="262" x2="700" y2="262" class="div"/>
    <text x="514" y="284" class="e"><tspan class="eb">E2</tspan> cota contada por</text>
    <text x="514" y="302" class="e">conta, não por pessoa (P1)</text>
  </g>
  <g>
    <rect x="730" y="150" width="200" height="170" rx="6" class="exp"/>
    <text x="744" y="176" class="titulo">3. Registro e correlação</text>
    <text x="744" y="198" class="desc">conta, horário,</text>
    <text x="744" y="215" class="desc">quantidade e IP</text>
    <line x1="730" y1="262" x2="930" y2="262" class="div"/>
    <text x="744" y="284" class="e"><tspan class="eb">E3</tspan> IP muda com VPN e</text>
    <text x="744" y="302" class="e">é compartilhado (P2)</text>
  </g>
  <g>
    <rect x="960" y="150" width="200" height="170" rx="6" class="exp"/>
    <text x="974" y="176" class="titulo">4. Resposta da compra</text>
    <text x="974" y="198" class="desc">aceite, retenção, recusa</text>
    <text x="974" y="215" class="desc">ou pedido de verificação</text>
    <line x1="960" y1="262" x2="1160" y2="262" class="div"/>
    <text x="974" y="284" class="e"><tspan class="eb">E4</tspan> a resposta dá pistas</text>
    <text x="974" y="302" class="e">dos critérios de detecção</text>
  </g>
  <g>
    <rect x="1190" y="150" width="240" height="170" rx="6" class="exp"/>
    <text x="1204" y="176" class="titulo">5. Emissão do ingresso</text>
    <text x="1204" y="198" class="desc">ingresso nominal e</text>
    <text x="1204" y="215" class="desc">transferência</text>
    <line x1="1190" y1="262" x2="1430" y2="262" class="div"/>
    <text x="1204" y="284" class="e"><tspan class="eb">E6</tspan> titular registrado pode</text>
    <text x="1204" y="302" class="e">não ser quem vai ao evento</text>
  </g>

  <line x1="470" y1="235" x2="498" y2="235" class="fluxo"/>
  <line x1="700" y1="235" x2="728" y2="235" class="fluxo"/>
  <line x1="930" y1="235" x2="958" y2="235" class="fluxo"/>
  <line x1="1160" y1="235" x2="1188" y2="235" class="fluxo"/>

  <!-- Painel do administrador -->
  <rect x="710" y="470" width="240" height="100" rx="6" class="box"/>
  <text x="724" y="498" class="titulo">Painel do administrador</text>
  <text x="724" y="520" class="desc">configura limite, sinais,</text>
  <text x="724" y="537" class="desc">verificação e emissão;</text>
  <text x="724" y="554" class="desc">revisa compras retidas</text>
  <line x1="725" y1="470" x2="682" y2="324" class="fluxo"/>
  <line x1="830" y1="470" x2="830" y2="324" class="fluxo"/>
  <line x1="935" y1="470" x2="1248" y2="324" class="fluxo"/>
  <text x="840" y="410" class="rot">aplica os controles</text>

  <!-- Externos -->
  <g>
    <rect x="370" y="720" width="180" height="80" rx="6" class="ext"/>
    <text x="384" y="750" class="titulo">Serviço de pagamento</text>
    <text x="384" y="772" class="desc">externo</text>
  </g>
  <g>
    <rect x="570" y="720" width="250" height="120" rx="6" class="ext-exp"/>
    <text x="584" y="748" class="titulo">Verificação de identidade</text>
    <text x="584" y="768" class="desc">externa, só quando exigida</text>
    <line x1="570" y1="782" x2="820" y2="782" class="div"/>
    <text x="584" y="804" class="e"><tspan class="eb">E5</tspan> identidade válida não prova</text>
    <text x="584" y="822" class="e">comprador independente (P3)</text>
  </g>
  <g>
    <rect x="1190" y="720" width="240" height="80" rx="6" class="ext"/>
    <text x="1204" y="750" class="titulo">Conferência na entrada</text>
    <text x="1204" y="772" class="desc">controle posterior à compra</text>
  </g>
  <line x1="530" y1="320" x2="530" y2="718" class="fluxo"/>
  <line x1="660" y1="320" x2="660" y2="718" class="fluxo-tr"/>
  <text x="652" y="440" text-anchor="end" class="rot">quando exigida</text>
  <line x1="1310" y1="320" x2="1310" y2="718" class="fluxo-tr"/>

  <!-- Ações dos atores -->
  <path d="M150,215 C210,215 220,280 268,280" class="adv"/>
  <text x="152" y="300" class="rot-adv">cria ou</text>
  <text x="152" y="316" class="rot-adv">controla</text>
  <text x="152" y="332" class="rot-adv">várias contas</text>
  <path d="M150,185 C260,110 440,110 560,148" class="adv"/>
  <text x="300" y="110" class="rot-adv">compra 4 por conta, via VPN ou intermediários</text>
  <path d="M1060,148 C1060,30 300,30 120,150" class="adv-tr"/>
  <text x="560" y="52" class="rot-adv">observa cada resposta e adapta a próxima tentativa</text>

  <path d="M150,460 L512,322" class="fluxo"/>
  <text x="270" y="448" class="rot">compra até 4</text>
  <line x1="900" y1="684" x2="900" y2="572" class="fluxo"/>
  <text x="910" y="620" class="rot">define regras e monitora resultados</text>

  <!-- Legenda -->
  <g>
    <rect x="20" y="690" width="300" height="174" rx="6" fill="#ffffff" stroke="#8b9baa"/>
    <text x="36" y="714" class="titulo">Legenda</text>
    <rect x="36" y="726" width="22" height="14" class="exp"/>
    <text x="68" y="738">ponto de exploração (E1 a E6)</text>
    <line x1="36" y1="760" x2="58" y2="760" stroke="#c7784a" stroke-width="3"/>
    <text x="68" y="764">ação do revendedor</text>
    <line x1="36" y1="784" x2="58" y2="784" stroke="#c7784a" stroke-width="2.5" stroke-dasharray="8 5"/>
    <text x="68" y="788">observação do revendedor (E4)</text>
    <line x1="36" y1="808" x2="58" y2="808" stroke="#53657c" stroke-width="1.8"/>
    <text x="68" y="812">fluxo da compra e configuração</text>
    <line x1="36" y1="832" x2="58" y2="832" stroke="#53657c" stroke-width="1.8" stroke-dasharray="6 4"/>
    <text x="68" y="836">eventual ou posterior à compra</text>
    <text x="36" y="856" class="desc">P1 a P3: pressupostos da seção 1.3</text>
  </g>
</svg>
